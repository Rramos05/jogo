<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Survivor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu" class="screen">
        <div class="logo">NEON<br><span>SURVIVOR</span></div>

        <p>Sobreviva. Destrua. Evolua.</p>

        <div class="menu-stats">
            <div>🏆 Recorde <b id="bestMenu">0</b></div>
        </div>

        <button id="playBtn">JOGAR</button>

        <small>WASD / SETAS • MOUSE / TOQUE</small>
    </div>

    <main id="game">
        <header class="hud">
            <div class="hud-box">
                <span>❤️</span>
                <div>
                    <small>VIDA</small>
                    <strong id="health">100</strong>
                </div>
            </div>

            <div class="hud-box">
                <span>⭐</span>
                <div>
                    <small>PONTOS</small>
                    <strong id="score">0</strong>
                </div>
            </div>

            <div class="hud-box">
                <span>🌊</span>
                <div>
                    <small>NÍVEL</small>
                    <strong id="level">1</strong>
                </div>
            </div>

            <div class="hud-box">
                <span>🏆</span>
                <div>
                    <small>RECORDE</small>
                    <strong id="best">0</strong>
                </div>
            </div>
        </header>

        <div id="powerBar">
            <div id="powerFill"></div>
        </div>

        <canvas id="canvas"></canvas>

        <div id="bossWarning">
            ⚠️ BOSS INCOMING ⚠️
        </div>

        <div id="gameOver" class="screen">
            <h1>GAME OVER</h1>

            <div class="result">
                <p>Pontuação</p>
                <strong id="finalScore">0</strong>
            </div>

            <div class="result">
                <p>Nível alcançado</p>
                <strong id="finalLevel">1</strong>
            </div>

            <button id="restartBtn">JOGAR NOVAMENTE</button>
            <button id="menuBtn" class="secondary">MENU</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
