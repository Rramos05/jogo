<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Ruan Ramos Barañano — Instagram e WhatsApp."
    >

    <meta

        content="#030303"
    >

    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Conteúdo principal -->
    <main class="container">

        <section class="content" aria-labelledby="nome">

            <!-- Linha decorativa superior -->

            <header>

                <h1 id="nome">
                    RUAN RAMOS
                    <br>

                </h1>

            <nav

                aria-label="Links de contato e redes sociais"
            >

                <a
                    href="https://www.instagram.com/ruannn05_/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="button instagram"
                    aria-label="Abrir Instagram de Ruan Ramos Barañano"
                >
                    <span aria-hidden="true">◎</span>
                    <span>INSTAGRAM</span>
                </a>

                <a
                    href="https://wa.me/5553997094670"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="button whatsapp"
                    aria-label="Entrar em contato pelo WhatsApp"
                >
                    <span aria-hidden="true">◉</span>
                    <span>WHATSAPP</span>
                </a>

            </nav>

            <!-- Linha decorativa inferior -->
            <div
                class="line bottom"
                aria-hidden="true"
            ></div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
