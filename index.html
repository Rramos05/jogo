<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Strike</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu">
    <div class="brand">TACTICAL<span>STRIKE</span></div>

    <p>FPS TÁTICO • COMPETITIVO</p>

    <button id="play">JOGAR</button>

    <small>
        WASD • Mouse • Clique para atirar • R recarrega • B compra
    </small>
</div>

<div id="game">

    <div id="top">

        <div class="team ct">
            CT <b id="ctScore">0</b>
        </div>

        <div id="roundInfo">
            <strong id="timer">01:55</strong>
            <small id="roundText">ROUND 1</small>
        </div>

        <div class="team tr">
            <b id="trScore">0</b> TR
        </div>

    </div>

    <div id="killFeed"></div>

    <div id="crosshair">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
    </div>

    <div id="hud">

        <div class="leftHud">

            <div class="health">
                <span>♥</span>
                <b id="health">100</b>
            </div>

            <div class="armor">
                <span>◆</span>
                <b id="armor">100</b>
            </div>

        </div>

        <div id="weapon">

            <div class="weaponName" id="weaponName">
                AK-47
            </div>

            <div class="ammo">
                <b id="ammo">30</b>
                /
                <span id="reserve">90</span>
            </div>

        </div>

        <div id="money">
            $<span id="moneyValue">800</span>
        </div>

    </div>

    <div id="radar">
        <div class="radarPlayer"></div>
    </div>

    <div id="buy">

        <div class="buyPanel">

            <h2>ARSENAL</h2>

            <p>Dinheiro: $<span id="buyMoney">800</span></p>

            <button data-gun="glock">
                1 — GLOCK-18
                <span>$200</span>
            </button>

            <button data-gun="deagle">
                2 — DESERT EAGLE
                <span>$700</span>
            </button>

            <button data-gun="ak">
                3 — AK-47
                <span>$2700</span>
            </button>

            <button data-gun="m4">
                4 — M4A1
                <span>$3100</span>
            </button>

            <button data-gun="awp">
                5 — AWP
                <span>$4750</span>
            </button>

            <button data-gun="armor">
                6 — COLETE
                <span>$650</span>
            </button>

            <button id="closeBuy">
                FECHAR
            </button>

        </div>

    </div>

    <div id="roundEnd">

        <h1 id="roundTitle">ROUND VENCIDO</h1>

        <p id="roundReason"></p>

        <button id="continue">
            CONTINUAR
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
